# Mises à jour automatiques proposées en PR. Les titres respectent le format de commit exigé par
# pr-title.yml (docs/workflow-git.md).
#
# Au plus une PR par écosystème et par mois, pour limiter le bruit (notifications, runs de CI) :
#  - Gradle : AGP, Gradle, Kotlin, KSP et Compose sont couplés (Compose exige une version minimale
#    d'AGP, KSP suit Kotlin et AGP, AGP suit Gradle). Des PR séparées échouent chacune seule ; un
#    groupe unique, majeures comprises, les fait monter ensemble ;
#  - GitHub Actions : un groupe unique aussi, majeures comprises.
# Pas de rebase automatique : chaque rebase relancerait la CI et renverrait des notifications. Pour
# mettre une PR à jour, commenter « @dependabot rebase ».
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [dependencies, suite]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [major, minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    labels: [dependencies, suite]
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    cooldown:
      default-days: 3
    groups:
      gradle:
        patterns: ["*"]
        update-types: [major, minor, patch]
