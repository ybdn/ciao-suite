# Mises à jour automatiques proposées en PR. Les titres respectent le format de commit exigé par
# pr-title.yml (docs/workflow-git.md).
#
# Groupes Gradle, dans l'ordre de priorité (une dépendance va dans le premier qui la correspond) :
#  - `toolchain` : AGP, Kotlin, KSP et compilateur Compose, dont les versions sont couplées ;
#    ils montent ensemble (même en majeur) pour ne pas casser `build-logic/` isolément ;
#  - `minor-patch` : tout le reste en mise à jour mineure ou corrective, sans risque de rupture ;
#  - les mises à jour majeures restantes ont chacune leur PR, pour ne pas bloquer les autres.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: [dependencies, suite]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    labels: [dependencies, suite]
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      toolchain:
        patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp*"
      minor-patch:
        update-types: [minor, patch]
