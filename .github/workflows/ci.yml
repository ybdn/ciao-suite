name: CI

# Un seul workflow pour toute la suite : chaque app n'est buildée que si elle (ou le code partagé)
# a changé. Le job « CI OK » agrège le résultat : c'est lui qui est exigé par la protection de
# branche, car il s'exécute toujours (un job ignoré compte comme réussi).
on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

# On n'annule que les runs de PR obsolètes : annuler un run de `main` ferait échouer « CI OK »
# et perdrait l'APK du commit fusionné.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Apps modifiées
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      galerie: ${{ steps.filter.outputs.galerie }}
      clavier: ${{ steps.filter.outputs.clavier }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Ajouter une entrée par app (voir « Ajouter une app » dans le README).
          filters: |
            commun: &commun
              - "core/**"
              - "build-logic/**"
              - "gradle/**"
              - "*.gradle.kts"
              - "gradle.properties"
              - ".github/workflows/ci.yml"
              - ".github/workflows/_android-app.yml"
              - ".github/scripts/**"
            workflows:
              - ".github/**"
            galerie:
              - *commun
              - "apps/galerie/**"
            clavier:
              - *commun
              - "apps/clavier/**"

  galerie:
    name: Galerie
    needs: changes
    if: needs.changes.outputs.galerie == 'true'
    uses: ./.github/workflows/_android-app.yml
    with:
      app: galerie
      upload-apk: ${{ github.event_name == 'push' }}

  clavier:
    name: Clavier
    needs: changes
    if: needs.changes.outputs.clavier == 'true'
    uses: ./.github/workflows/_android-app.yml
    with:
      app: clavier
      upload-apk: ${{ github.event_name == 'push' }}

  # Une erreur de syntaxe dans un workflow n'apparaît sinon qu'à son exécution (cas de
  # release.yml, en échec sur chaque push tant que le `if` sur `secrets` était invalide).
  actionlint:
    name: Workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, actionlint, galerie, clavier]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Un job a échoué ou a été annulé
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Tous les jobs ont réussi ou n'étaient pas concernés."
