# Publie une GitHub Release avec l'APK release d'une app, déclenchée par le tag de version
# `<app>-v<semver>` (voir docs/workflow-git.md, section 4). Générique : ajouter une app ne
# demande aucune modification ici, le nom est extrait du tag.
name: Release APK

on:
  push:
    tags:
      - "*-v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extraire l'app et la version depuis le tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%-v*}"
          version="${tag#"$app"-v}"
          # Le nom de tag est libre : on valide le format avant de l'utiliser ailleurs.
          if ! printf '%s' "$app" | grep -Eq '^[a-z0-9-]+$' \
            || ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag $tag hors format <app>-v<semver>" >&2
            exit 1
          fi
          if [ ! -d "apps/$app" ]; then
            echo "Aucune app apps/$app pour le tag $tag" >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configurer le JDK et le cache Gradle
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # keystore.properties reconstitué depuis les secrets du repo : clé d'importation release
      # commune à toutes les apps (cf. ReleaseSigning.kt et le CLAUDE.md racine). Une release
      # sans clé serait un APK non signé, donc non installable : on échoue plutôt que de publier.
      - name: Reconstituer keystore.properties depuis les secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] \
            || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Secrets de signature RELEASE_* manquants : release impossible." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ciao-suite-release.jks
          cat > keystore.properties <<EOF
          storeFile=ciao-suite-release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build de l'APK release
        env:
          APP: ${{ steps.tag.outputs.app }}
        run: ./gradlew ":apps:$APP:assembleRelease" --no-daemon

      - name: Vérifier que l'APK est signé
        id: apk
        env:
          APP: ${{ steps.tag.outputs.app }}
        run: |
          apk="$(find "apps/$APP/build/outputs/apk/release" -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::Aucun APK release trouvé pour $APP." >&2
            exit 1
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Extraire la section du CHANGELOG
        id: notes
        env:
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          app="$APP"
          version="$VERSION"
          changelog="apps/$app/CHANGELOG.md"
          notes_file="$RUNNER_TEMP/release-notes.md"
          # Titre exact « ## <version> » (éventuellement suivi d'une date) : `## 0.1.1` ne doit
          # pas correspondre à `## 0.1.10`.
          awk -v version="$version" '
            $1 == "##" && $2 == version { found=1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' "$changelog" > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "APK release de $app $version." > "$notes_file"
          fi
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publier la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ steps.tag.outputs.app }}
          VERSION: ${{ steps.tag.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          app="$APP"
          version="$VERSION"
          apk="$APK"
          app_title="$(tr '[:lower:]' '[:upper:]' <<< "${app:0:1}")${app:1}"
          prerelease_flag=()
          case "$version" in
            0.*) prerelease_flag=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "C!ao $app_title $version" \
            --notes-file "$NOTES_FILE" \
            "${prerelease_flag[@]}"

      - name: Nettoyer le keystore du runner
        if: always()
        run: rm -f ciao-suite-release.jks keystore.properties
