# Workflow réutilisable : build + tests unitaires d'une app de la suite.
# Appelé par ci.yml, un job par app, seulement si l'app ou le code partagé a changé.
name: App Android (réutilisable)

on:
  workflow_call:
    inputs:
      app:
        description: "Nom du module sous apps/ (ex. galerie)"
        required: true
        type: string
      upload-apk:
        description: "Publier l'APK debug comme artifact du run"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Cache Gradle fourni par setup-java (MIT). Pas de gradle/actions : depuis la v6, son cache
      # est un composant propriétaire soumis à des conditions d'utilisation.
      - name: Configurer le JDK et le cache Gradle
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build et tests unitaires
        run: ./gradlew :apps:${{ inputs.app }}:assembleDebug :apps:${{ inputs.app }}:testDebugUnitTest --no-daemon

      - name: Upload de l'APK en artifact
        if: ${{ inputs.upload-apk }}
        uses: actions/upload-artifact@v7
        with:
          name: ciao-${{ inputs.app }}-debug-apk
          path: apps/${{ inputs.app }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error
